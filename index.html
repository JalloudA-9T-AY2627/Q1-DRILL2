<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <style>
        body {
            background-color: rgb(190, 167, 152);
        }
        h1 {
            background-color: #725b4d;
            text-align: center;
            font-family: monospace;
            color: rgb(255, 255, 255);
        }
        div {
            background-color: rgb(255, 255, 255);
            
            border: 3px solid rgb(52, 49, 68);
            border-radius: 5px;
            box-shadow: 10px 9px 5px 2px rgba(5,5,5,0.75);
        -webkit-box-shadow: 10px 9px 5px 2px rgba(5,5,5,0.75);
        -moz-box-shadow: 10px 9px 5px 2px rgba(5,5,5,0.75);
            padding: 15px; 
            width: 80%;
            
            img {
                display: block;
                margin: 0 auto;
                border-radius: 100px;
            }
        }
        h3 {
            text-align: center;
            font-family: monospace;
            
        }
        footer {
            text-align: center;
            font-family: monospace;
            color: rgb(0, 0, 0);
        }
        
    </style>
    <title>Document</title>
</head>
<body>
    <h1> RATE A MOVIE</h1>
    <h3> Share your top pick and write a review.</h3>
    <div style="display: flex; flex-direction: column; align-items: center;">
        
       <form>
       <div style="margin-bottom: 15px; text-align: center;">
        <input type="text" placeholder="Enter a Movie Title" style="width: 90%; padding: 8px; font-family: monospace;" required>
      </div>

      <div style="margin-bottom: 15px;">
        <strong>Genres:</strong><br>
        <label><input type="checkbox" name="genre"> Action</label>
        <label><input type="checkbox" name="genre"> Comedy</label>
        <label><input type="checkbox" name="genre"> Drama</label>
        <label><input type="checkbox" name="genre"> Fantasy</label>
        <label><input type="checkbox" name="genre"> Sci-Fi</label>
      </div>

       <div style="margin-bottom: 15px;">
        <strong>Rating:</strong><br>
        <label><input type="radio" name="rating">✰</label>
        <label><input type="radio" name="rating">✰✰</label>
        <label><input type="radio" name="rating">✰✰✰</label>
        <label><input type="radio" name="rating">✰✰✰✰</label>
        <label><input type="radio" name="rating">✰✰✰✰✰ </label>
      </div>

       <div style="margin-bottom: 15px; text-align: center;">
        <textarea placeholder="Write your review..." style="width: 90%; height: 60px; padding: 8px; font-family: monospace;"></textarea>
      </div>
            <button type="submit" style="width: 100%; background-color: #725b4d; color: #fff; padding: 10px; border: none; font-family: monospace; cursor: pointer;">
        Submit Review
      </button>
      <p style="font-size: 12px; margin-top: 10px;">
        Movie Review Tips: Click <a href="#">here</a>
      </p>


       </form>

    </div>

    <footer>

    </footer>
</body>
